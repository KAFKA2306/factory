[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorydb"
version = "0.2.0"
description = "Official-source global factory database, API and static distribution UI"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[project.scripts]
factorydb-api = "factorydb.api:main"
factorydb-mcp = "factorydb.mcp_server:main"
factorydb-validate = "factorydb.validate:main"
factorydb-verification-pack = "factorydb.verification_pack:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
