<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="公式一次情報に基づく世界の企業・工場データベース">
  <title>FactoryDB Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#">FactoryDB</a>
    <nav aria-label="主要ナビゲーション">
      <a href="#explorer">Explorer</a>
      <a href="#insights">Data</a>
      <a href="#health">Coverage</a>
      <a href="https://github.com/KAFKA2306/factory">GitHub</a>
    </nav>
  </header>

  <main>
    <section class="hero" id="explorer">
      <p class="eyebrow">OFFICIAL-SOURCE GLOBAL MANUFACTURING EXPLORER</p>
      <h1>世界の工場を、<br>製品から探す。</h1>
      <p class="lead">国・企業・製品・工程を横断して検索。各レコードから公式一次情報まで直接辿れます。</p>
      <div class="hero-search">
        <label class="sr-only" for="query">工場・企業・製品・工程を検索</label>
        <input id="query" type="search" placeholder="例: Toyota / battery / cement / brewing" autocomplete="off">
        <button id="clear-query" type="button">クリア</button>
      </div>
      <div id="hero-stats" class="hero-stats" aria-label="データ概要"></div>
    </section>

    <section class="explorer-panel" aria-label="工場検索">
      <div class="filter-row">
        <label>国・地域
          <select id="country"><option value="">すべて</option></select>
        </label>
        <label>工程
          <select id="process"><option value="">すべて</option></select>
        </label>
        <label>並び順
          <select id="sort">
            <option value="country">国・地域</option>
            <option value="name">工場名</option>
          </select>
        </label>
      </div>
      <div class="section-title">
        <div>
          <p class="kicker">FACTORIES</p>
          <h2>工場・製造拠点</h2>
        </div>
        <span id="count"></span>
      </div>
      <div id="empty-state" class="empty-state" hidden>条件に一致する工場はありません。</div>
      <div id="facilities" class="factory-list"></div>
    </section>

    <section class="secondary" id="insights">
      <div class="section-title">
        <div>
          <p class="kicker">RELATED DATA</p>
          <h2>設備・投資・財務</h2>
        </div>
      </div>
      <div class="secondary-grid">
        <details open>
          <summary>設備資産 <span id="asset-count"></span></summary>
          <div id="assets" class="mini-list"></div>
        </details>
        <details>
          <summary>投資 <span id="investment-count"></span></summary>
          <div id="investments" class="mini-list"></div>
        </details>
        <details>
          <summary>財務 <span id="financial-count"></span></summary>
          <div id="financials" class="mini-list"></div>
        </details>
      </div>
    </section>

    <section class="coverage" id="health">
      <div>
        <p class="kicker">DATA COVERAGE</p>
        <h2>収録状況</h2>
        <p>これは開発・監査情報です。一般検索を妨げないよう下位に配置しています。</p>
      </div>
      <section id="metrics" class="metrics" aria-label="データカバレッジ"></section>
    </section>
  </main>

  <template id="facility-template">
    <article class="factory-card">
      <div class="factory-topline">
        <span class="country"></span>
        <span class="status"></span>
      </div>
      <h3></h3>
      <p class="meta"></p>
      <div class="fact-row"><span>製品</span><strong class="products"></strong></div>
      <div class="fact-row"><span>工程</span><strong class="processes"></strong></div>
      <a class="source" target="_blank" rel="noreferrer">公式一次情報を見る →</a>
    </article>
  </template>

  <script src="app.js" defer></script>
</body>
</html>
