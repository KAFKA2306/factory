services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: factorydb
      POSTGRES_USER: factorydb
      POSTGRES_PASSWORD: factorydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U factorydb -d factorydb"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - factorydb-postgres:/var/lib/postgresql/data

  opensearch:
    image: opensearchproject/opensearch:3.9.0
    environment:
      discovery.type: single-node
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - factorydb-opensearch:/usr/share/opensearch/data

  api:
    build: .
    environment:
      FACTORYDB_DATABASE_URL: postgresql://factorydb:factorydb@postgres:5432/factorydb
      FACTORYDB_OPENSEARCH_URL: http://opensearch:9200
    depends_on:
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); assert d['status']=='ok'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  factorydb-postgres:
  factorydb-opensearch:
