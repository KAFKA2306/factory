name: Projection integration

on:
  pull_request:
    paths:
      - "compose.yaml"
      - "data/companies*.jsonl"
      - "data/facilities/**"
      - "src/factorydb/models.py"
      - "infra/postgres/**"
      - "infra/opensearch/**"
      - "scripts/rebuild_local_projections.sh"
      - ".github/workflows/projections.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  projections:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.28"
      - run: uv sync --locked --extra dev
      - name: Prepare OpenSearch host requirements
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Rebuild PostgreSQL and OpenSearch projections
        run: bash scripts/rebuild_local_projections.sh
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove local projection services
        if: always()
        run: docker compose down -v
