name: Robotics identity probe

on:
  pull_request:
    paths:
      - .github/workflows/robotics-identity-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: List canonical companies and facility counts
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          companies = []
          for path in sorted(Path('data').glob('companies*.jsonl')):
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip(): companies.append(json.loads(line))
          facilities = []
          for path in sorted(Path('data/facilities').glob('*.jsonl')):
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip(): facilities.append(json.loads(line))
          counts = Counter(row['company_id'] for row in facilities)
          by_id = {}
          for company in companies:
              by_id.setdefault(company['id'], company)
          for company_id, company in sorted(by_id.items(), key=lambda item: item[1]['legal_name'].lower()):
              print('COMPANY', company_id, '|', company['legal_name'], '| facilities', counts[company_id])
          print('TOTAL_COMPANIES', len(by_id), 'TOTAL_FACILITIES', len(facilities))
          PY
