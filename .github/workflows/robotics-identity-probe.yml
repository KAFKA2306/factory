name: Robotics identity probe

on:
  pull_request:
    paths:
      - .github/workflows/robotics-identity-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: List candidate canonical identities
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          keywords = [
              'toyota','honda','bmw','volkswagen','hyundai','mercedes','ford',
              'general motors','abb','siemens','bosch','catl','amperex','panasonic'
          ]
          companies = []
          for path in sorted(Path('data').glob('companies*.jsonl')):
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip(): companies.append(json.loads(line))
          facilities = []
          for path in sorted(Path('data/facilities').glob('*.jsonl')):
              for line in path.read_text(encoding='utf-8').splitlines():
                  if line.strip(): facilities.append(json.loads(line))

          seen = set()
          for key in keywords:
              matched = [c for c in companies if key in c['legal_name'].lower() or key in c['id'].lower()]
              for company in matched:
                  if company['id'] in seen: continue
                  seen.add(company['id'])
                  print('COMPANY', company['id'], '|', company['legal_name'])
                  for facility in facilities:
                      if facility['company_id'] == company['id']:
                          print('  FACILITY', facility['id'], '|', facility['name'], '|', facility['country_code'])
          print('TOTAL_COMPANIES', len(companies), 'TOTAL_FACILITIES', len(facilities))
          PY
