name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m factorydb.validate
      - run: python -m factorydb.coverage_validation
      - run: python scripts/build_catalog.py
      - name: Build public Facility Verification Pack sample
        run: |
          factorydb-verification-pack \
            --company company:toyota-motor-corporation \
            --format json > web/facility-verification-pack.json
          factorydb-verification-pack \
            --company company:toyota-motor-corporation \
            --format markdown > web/facility-verification-pack.md
          python -m json.tool web/facility-verification-pack.json > /dev/null
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
