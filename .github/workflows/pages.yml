name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -e .
      - run: python -m factorydb.validate
      - run: python -m factorydb.coverage_validation
      - run: python scripts/build_catalog.py
      - name: Build public Facility Verification Pack sample
        run: |
          factorydb-verification-pack \
            --company company:toyota-motor-corporation \
            --format json > web/facility-verification-pack.json
          factorydb-verification-pack \
            --company company:toyota-motor-corporation \
            --format markdown > web/facility-verification-pack.md
          python -m json.tool web/facility-verification-pack.json > /dev/null
      - name: Stamp deployment identity into the artifact
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("web/deployment.json").write_text(
              json.dumps(
                  {
                      "source_commit": os.environ["SOURCE_COMMIT"],
                      "github_run_id": int(os.environ["RUN_ID"]),
                  },
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify exact production artifact and browser journey
        run: node scripts/browser_smoke.mjs "${{ steps.deployment.outputs.page_url }}" "${{ github.sha }}"
      - name: Verify the public procurement sample
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.parse import urljoin
          from urllib.request import urlopen

          url = urljoin(os.environ["PAGE_URL"], "facility-verification-pack.json")
          last_error = None
          for _ in range(60):
              try:
                  with urlopen(url, timeout=10) as response:
                      payload = json.load(response)
                  if payload.get("decision_status") != "VERIFIED":
                      raise RuntimeError(f"unexpected decision status: {payload.get('decision_status')}")
                  print(f"verified {url}")
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(1)
          else:
              raise SystemExit(f"public sample verification failed: {last_error}")
          PY
      - name: Record production acceptance evidence on Issue 20
        env:
          GH_TOKEN: ${{ github.token }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          SOURCE_COMMIT: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$(gh issue view 20 --repo "$GITHUB_REPOSITORY" --json state --jq .state)" = "OPEN" ]; then
            cat > /tmp/production-evidence.md <<EOF
          <!-- factorydb-pages-production-evidence -->
          Production acceptance verified for exact main commit \`$SOURCE_COMMIT\`.

          - Pages URL: $PAGE_URL
          - GitHub Actions run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$RUN_ID
          - \`deployment.json\` on Pages matched exact \`$SOURCE_COMMIT\`
          - real Chrome journey passed: load → search → select 2 facilities → compare → source links → URL share/restore
          - empty-result state passed and explicitly says 0 search results do not prove nonexistence
          - forced \`catalog.json\` network failure passed the visible error-state check and cleared stale cards
          - freshness/staleness is explicitly unresolved rather than fabricated
          - keyboard focus is visible
          - 320px viewport at 200% page scale has no page-level horizontal overflow; the wide comparison table remains inside its own scroll container
          - public Facility Verification Pack JSON was reachable and retained \`decision_status=VERIFIED\`

          This comment is emitted only after every production check above succeeds.
          EOF
            gh issue comment 20 --repo "$GITHUB_REPOSITORY" --body-file /tmp/production-evidence.md
          fi
