name: Bootstrap project

on:
  push:
    branches: [agent/global-factory-database]
    paths:
      - ".bootstrap.part*"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/global-factory-database
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract project
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import tarfile
          from pathlib import Path

          root = Path.cwd().resolve()
          parts = sorted(root.glob(".bootstrap.part*"))
          if len(parts) != 5:
              raise RuntimeError(f"expected 5 payload parts, found {len(parts)}")
          archive = base64.b64decode("".join(path.read_text().strip() for path in parts))
          with tarfile.open(fileobj=io.BytesIO(archive), mode="r:gz") as bundle:
              for member in bundle.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise RuntimeError(f"unsafe archive path: {member.name}")
              bundle.extractall(root)
          for path in parts:
              path.unlink()
          (root / ".github/workflows/bootstrap.yml").unlink()
          PY
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest
      - run: python -m factorydb.validate
      - run: python scripts/build_catalog.py
      - name: Commit generated project
        run: |
          git config user.name "factorydb-bot"
          git config user.email "137051370+KAFKA2306@users.noreply.github.com"
          git add -A
          git commit -m "Build global factory database foundation"
          git push origin HEAD:agent/global-factory-database
