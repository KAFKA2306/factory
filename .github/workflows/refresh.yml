name: Refresh official data

on:
  workflow_dispatch:
  schedule:
    - cron: "31 20 * * 6"

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/sync_worldbank.py
      - run: python scripts/sync_sec_companyfacts.py
      - run: python -m factorydb.validate
      - run: python scripts/build_catalog.py
      - name: Create update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: data/official-refresh
          delete-branch: true
          commit-message: "Refresh official factory and financial data"
          title: "data: refresh official factory and financial data"
          body: |
            Automated refresh from official World Bank and SEC APIs.
            No sample, dummy, or inferred values are introduced.
          labels: data, automated
