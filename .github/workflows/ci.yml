name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Run pytest
        id: pytest
        continue-on-error: true
        run: pytest -vv --junitxml=pytest-results.xml
      - name: Upload pytest diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml
      - name: Fail if pytest failed
        if: steps.pytest.outcome != 'success'
        run: exit 1
      - run: python -m factorydb.validate
      - run: python -m factorydb.coverage_validation
      - run: python scripts/build_catalog.py
      - run: test -s web/catalog.json
      - run: python -m json.tool web/catalog.json > /dev/null
